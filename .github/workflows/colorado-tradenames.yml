name: Colorado restaurant trade names
# Fetches Colorado trade names, filters for food/drink businesses, appends to the data/ CSV.

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 13:17 UTC (7:17am Denver in summer, 6:17am in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: colorado-tradenames
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch, filter, append
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python scripts/colorado_tradenames.py
      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/colorado_restaurant_tradenames.csv
          git diff --cached --quiet || git commit -m "Update Colorado restaurant trade names $(date -u +%F)"
          git push
